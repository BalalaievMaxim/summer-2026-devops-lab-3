name: Lab 3 CI

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Lint C# Application
        run: dotnet build summer-2026-devops-lab-3.sln -c Release /warnaserror

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/mywebapp/Dockerfile

      - name: Lint YAML files
        run: |
          sudo apt-get install yamllint
          yamllint docker-compose.yaml .github/workflows/ || echo "Yaml linting failed, check configuration"