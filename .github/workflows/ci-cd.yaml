name: Lab 3 CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Lint C# Application
        run: dotnet build summer-2026-devops-lab-3.sln -c Release /warnaserror

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/mywebapp/Dockerfile

      - name: Lint YAML files
        run: |
          sudo apt-get install yamllint
          yamllint docker-compose.yaml .github/workflows/ || echo "Yaml linting failed, check configuration"

      - name: Run tests with coverage
        run: |
          dotnet test summer-2026-devops-lab-3.sln --no-build -c Release \
          /p:CollectCoverage=true \
          /p:CoverletOutputFormat=cobertura \
          /p:Threshold=40

      - name: Upload coverage report
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: src/mywebapp.Tests/coverage.cobertura.xml

  build-image:
    name: Build and push Docker image
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/mywebapp
          file: ./src/mywebapp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Target Node
    needs: build-image
    runs-on: self-hosted
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy configuration to Target Node
        run: |
          scp -o StrictHostKeyChecking=no nginx.conf docker-compose.yaml ${{ secrets.TARGET_NODE_IP }}:/opt/mywebapp/

      - name: Pull latest images and restart service
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.TARGET_NODE_IP }} "
            cd /opt/mywebapp && \
            docker compose pull && \
            sudo systemctl restart mywebapp.service
          "

      - name: Verify Deployment
        run: |
          chmod +x scripts/verify-form-runner.sh
          ./scripts/verify-form-runner.sh ${{ secrets.TARGET_NODE_IP }}